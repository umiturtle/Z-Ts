name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Linux CI (Docs lint + Formatting + Xvfb GTK3 / WebKit2GTK 4.1)
  # ---------------------------------------------------------------------------
  ci-linux:
    name: Linux (Ubuntu 24.04 + Xvfb + WebKit2GTK 4.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: linux-zig-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            linux-zig-0.17.0-

      - name: Install GTK3, WebKit2GTK 4.1 & Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb

      - name: Lint docs, check formatting & run tests under Xvfb
        run: |
          set -o pipefail
          {
            echo "#### Linux CI Output"
            echo '```text'
            chmod +x ./zigw
            python3 scripts/check-docs.py
            ./zigw fmt --check src/ build.zig build.zig.zon
            xvfb-run -a ./zigw build test --summary all
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. macOS CI (Apple Silicon — AppKit / WKWebView target verification)
  # ---------------------------------------------------------------------------
  ci-macos:
    name: macOS (arm64 + WKWebView)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: macos-zig-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            macos-zig-0.17.0-

      - name: Build & test on macOS
        run: |
          set -o pipefail
          {
            echo "#### macOS CI Output"
            echo '```text'
            chmod +x ./zigw
            ./zigw build test --summary all
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. Windows CI (x86_64 — Win32 / WebView2 target verification)
  # ---------------------------------------------------------------------------
  ci-windows:
    name: Windows (x86_64 + WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\zig
            .zig-cache
          key: windows-zig-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            windows-zig-0.17.0-

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build & test on Windows
        shell: bash
        run: |
          set -o pipefail
          {
            echo "#### Windows CI Output"
            echo '```text'
            zig version
            zig build test --summary all
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
