name: CI & Cache Warmer

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Pre-warm Zig 0.17.0 global cache and publish to `ci-cache-linux-x64`
  #    so ephemeral Arena sandboxes can hydrate ~/.cache/zig in ~1.5s via
  #    codeload.github.com instead of spending ~94s cold-compiling std/libc!
  # ---------------------------------------------------------------------------
  warm-zig-cache:
    name: Warm Zig Cache (Linux x86_64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous CI Zig cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-0.17.0-linux-x64-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            zig-0.17.0-linux-x64-

      - name: Warm Zig build runner, std, and Linux libc cache
        env:
          ZTS_SKIP_CACHE_SYNC: "1"
        run: |
          chmod +x ./zigw
          ./zigw build test
          # Also warm native -lc / compiler_rt artifacts used by Linux GTK/WebKit builds
          TMP_C="$(mktemp -d)"
          printf 'const std = @import("std");\npub fn main() void {}\n' > "${TMP_C}/warm_c.zig"
          ./zigw build-exe "${TMP_C}/warm_c.zig" -lc -femit-bin="${TMP_C}/warm_c"
          rm -rf "$TMP_C"

      - name: Publish pre-warmed cache tarball to orphan branch `ci-cache-linux-x64`
        run: |
          STAGE="$(mktemp -d)"
          tar -cf - -C "${HOME}/.cache/zig" . | gzip -1 > "${STAGE}/zig-cache.tar.gz"
          ls -lh "${STAGE}/zig-cache.tar.gz"

          cd "$STAGE"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zig-cache.tar.gz
          git commit -q -m "chore(cache): pre-warm Zig 0.17.0 cache (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-cache-linux-x64

  # ---------------------------------------------------------------------------
  # 2. Linux CI (Docs lint + Formatting + Xvfb GTK3 / WebKit2GTK 4.1 ready)
  # ---------------------------------------------------------------------------
  ci-linux:
    name: Linux (Ubuntu 24.04 + Xvfb + WebKit2GTK 4.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: linux-zig-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            linux-zig-0.17.0-

      - name: Install GTK3, WebKit2GTK 4.1 & Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            xvfb

      - name: Check documentation structure & multi-agent invariants
        run: python3 scripts/check-docs.py

      - name: Check Zig formatting
        env:
          ZTS_SKIP_CACHE_SYNC: "1"
        run: ./zigw fmt --check src/ build.zig build.zig.zon

      - name: Build & test under Xvfb virtual display
        env:
          ZTS_SKIP_CACHE_SYNC: "1"
        run: xvfb-run -a ./zigw build test --summary all

  # ---------------------------------------------------------------------------
  # 3. macOS CI (Apple Silicon — AppKit / WKWebView target verification)
  # ---------------------------------------------------------------------------
  ci-macos:
    name: macOS (arm64 + WKWebView)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: macos-zig-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            macos-zig-0.17.0-

      - name: Build & test on macOS
        env:
          ZTS_SKIP_CACHE_SYNC: "1"
        run: ./zigw build test --summary all

  # ---------------------------------------------------------------------------
  # 4. Windows CI (x86_64 — Win32 / WebView2 target verification)
  # ---------------------------------------------------------------------------
  ci-windows:
    name: Windows (x86_64 + WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\zig
            .zig-cache
          key: windows-zig-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
          restore-keys: |
            windows-zig-0.17.0-

      - name: Install Zig 0.17.0 via PyPI
        run: pip install ziglang==0.17.0

      - name: Build & test on Windows
        run: python -m ziglang build test --summary all
