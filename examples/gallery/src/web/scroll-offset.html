<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Z-Ts — scrolled document</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:"ZTS Sans", sans-serif;
         background:#0f172a; color:#e2e8f0; }
  header { position:sticky; top:0; padding:12px 22px; background:rgba(15,23,42,.92);
           border-bottom:1px solid #1e293b; font-size:12px; letter-spacing:.18em;
           text-transform:uppercase; color:#64748b; }
  section { min-height:520px; padding:40px 28px; border-bottom:1px dashed #1e293b; }
  section:nth-child(odd) { background:#0b1120; }
  h2 { font-size:30px; margin:0 0 10px; }
  .idx { font-size:72px; font-weight:800; color:#1e293b; line-height:1; }
  p { color:#94a3b8; max-width:52ch; line-height:1.9; font-size:14px; }
  .target { outline:3px solid #22d3ee; outline-offset:-3px; }
  .flag { display:inline-block; margin-top:16px; padding:8px 16px; border-radius:999px;
          background:#22d3ee; color:#042f2e; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<header>scroll-offset · 2 番目のセクションまでスクロールした状態を撮影</header>
<section><div class="idx">01</div><h2>先頭セクション</h2>
  <p>このセクションはスクロールで画面外に出ます。キャプチャが「可視ビューポート」を撮っていること、
     つまりスクロール位置が反映されていることを、下のターゲット要素の位置で確認します。</p></section>
<section class="target" id="target"><div class="idx">02</div><h2>スクロール後のターゲット</h2>
  <p>このブロックの上端がビューポート上端に揃うよう <code>scrollIntoView()</code> しています。
     キャプチャ結果の最上部に「02」の大きな数字と、この見出しが写っていれば成功です。</p>
  <span class="flag">SCROLLED · OK</span></section>
<section><div class="idx">03</div><h2>末尾セクション</h2>
  <p>ここは撮影範囲外です。</p></section>
<script>
  // レイアウト確定後にスクロールする（フォント読み込みで高さが変わっても追従）。
  addEventListener('load', function () {
    var el = document.getElementById('target');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
  });
</script>
</body>
</html>
