<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Z-Ts — hero (light)</title>
<style>
  :root { --ink:#101828; --muted:#475467; --brand:#4f46e5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system, "Hiragino Sans", "Noto Sans CJK JP", "Segoe UI", sans-serif; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 600px at 85% -10%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
      radial-gradient(900px 500px at -10% 110%, #cffafe 0%, rgba(207,250,254,0) 55%),
      #ffffff;
    color:var(--ink);
  }
  main { width:100%; padding:48px 56px; }
  .badge { display:inline-flex; gap:8px; align-items:center; padding:6px 14px; border-radius:999px;
    background:#eef2ff; color:var(--brand); font-size:13px; font-weight:600; letter-spacing:.02em; }
  h1 { margin:18px 0 10px; font-size:44px; line-height:1.15; letter-spacing:-0.02em; }
  h1 em { font-style:normal; color:var(--brand); }
  p.lead { margin:0; max-width:44ch; font-size:16px; line-height:1.7; color:var(--muted); }
  .row { display:flex; gap:14px; margin-top:28px; }
  .btn { padding:12px 22px; border-radius:10px; font-size:15px; font-weight:600;
         background:var(--brand); color:#fff; box-shadow:0 8px 20px rgba(79,70,229,.28); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid #d0d5dd; box-shadow:none; }
  .stats { display:flex; gap:36px; margin-top:36px; }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .slack { position:absolute; right:48px; bottom:40px; font-size:12px; color:#98a2b3; }
</style>
</head>
<body>
<main>
  <span class="badge">● Zig 0.17 · 単一バイナリ 2.5 MB</span>
  <h1>1 つの Zig コードから<br><em>3 つの成果物</em> を。</h1>
  <p class="lead">デスクトップ・ブラウザ・静的サイト。フロントエンドは無改造の
    <code>@tauri-apps/api</code> v2 がそのまま動きます。ターゲット別の分岐は 0 行。</p>
  <div class="row"><div class="btn">はじめる</div><div class="btn ghost">ドキュメント</div></div>
  <div class="stats">
    <div class="stat"><b>33</b><span>C ABI exports</span></div>
    <div class="stat"><b>3</b><span>native backends</span></div>
    <div class="stat"><b>0</b><span>runtime deps</span></div>
  </div>
  <div class="slack">screenshot: patterns/hero-light</div>
</main>
</body>
</html>
