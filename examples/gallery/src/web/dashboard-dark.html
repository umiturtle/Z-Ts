<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Z-Ts — dashboard (dark)</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    font-family:-apple-system, "Hiragino Sans", "Noto Sans CJK JP", "Segoe UI", sans-serif;
    background: radial-gradient(900px 500px at 100% 0%, #1e293b 0%, #0b1120 55%), #0b1120;
    color:#e2e8f0; display:flex; gap:18px; padding:20px;
  }
  aside { width:186px; flex:none; display:flex; flex-direction:column; gap:8px; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.04em; margin-bottom:14px; }
  .logo i { width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,#22d3ee,#6366f1); display:block; }
  nav a { display:block; padding:9px 12px; border-radius:9px; font-size:13px; color:#94a3b8; text-decoration:none; }
  nav a.on { background:#1e293b; color:#f8fafc; }
  main { flex:1; display:flex; flex-direction:column; gap:14px; }
  .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .card { background:#111c33; border:1px solid #1e293b; border-radius:14px; padding:16px; }
  .card span { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#64748b; }
  .card b { display:block; font-size:28px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .card u { color:#34d399; font-size:12px; text-decoration:none; }
  .panel { flex:1; background:#111c33; border:1px solid #1e293b; border-radius:14px; padding:16px;
           display:flex; flex-direction:column; gap:10px; }
  .panel h2 { margin:0; font-size:13px; font-weight:600; color:#cbd5e1; letter-spacing:.03em; }
  svg { width:100%; height:100%; }
  table { width:100%; border-collapse:collapse; font-size:12px; color:#94a3b8; }
  th { text-align:left; font-weight:500; color:#64748b; padding:4px 6px; }
  td { padding:4px 6px; border-top:1px solid #1e293b; }
  .ok { color:#34d399; }
</style>
</head>
<body>
<aside>
  <div class="logo"><i></i> Z-TS</div>
  <nav>
    <a class="on" href="#">Overview</a><a href="#">Windows</a><a href="#">IPC</a>
    <a href="#">Capture</a><a href="#">Settings</a>
  </nav>
</aside>
<main>
  <div class="cards">
    <div class="card"><span>IPC latency p50</span><b>0.21 ms</b><u>▲ 12% 改善</u></div>
    <div class="card"><span>Frames</span><b>60 fps</b><u>安定</u></div>
    <div class="card"><span>Binary size</span><b>2.5 MB</b><u>単一 exe</u></div>
  </div>
  <div class="panel">
    <h2>スループット (7 日間)</h2>
    <svg viewBox="0 0 640 200" preserveAspectRatio="none" aria-label="chart">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6366f1" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="M0 150 L90 120 L180 132 L270 80 L360 96 L450 54 L540 70 L640 28 L640 200 L0 200 Z" fill="url(#g)"/>
      <path d="M0 150 L90 120 L180 132 L270 80 L360 96 L450 54 L540 70 L640 28" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    </svg>
  </div>
  <div class="panel">
    <h2>最近のプラグイン呼び出し</h2>
    <table>
      <tr><th>command</th><th>window</th><th>status</th><th>ms</th></tr>
      <tr><td>plugin:window|set_title</td><td>main</td><td class="ok">ok</td><td>0.18</td></tr>
      <tr><td>plugin:event|emit</td><td>main</td><td class="ok">ok</td><td>0.09</td></tr>
      <tr><td>plugin:path|resolve</td><td>settings</td><td class="ok">ok</td><td>0.31</td></tr>
    </table>
  </div>
</main>
</body>
</html>
