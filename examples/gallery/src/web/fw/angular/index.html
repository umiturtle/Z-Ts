<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z-Ts — framework demo</title>
<style>/* Z-Ts framework demo — 3 OS で同一画素にするためシステムフォントを使わない。 */
@font-face { font-family:ZTSSans; font-style:normal; font-weight:400; font-display:block;
  src:url("/zts/fonts/zts-sans-400.woff2") format("woff2"); }
@font-face { font-family:ZTSSans; font-style:normal; font-weight:700; font-display:block;
  src:url("/zts/fonts/zts-sans-700.woff2") format("woff2"); }
@font-face { font-family:ZTSMono; font-style:normal; font-weight:400; font-display:block;
  src:url("/zts/fonts/zts-mono-400.woff2") format("woff2"); }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; height:100%; }
body { font-family:ZTSSans; font-size:15px; line-height:24px; color:#0f172a; background:#f4f6fb;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; font-kerning:normal;
  font-synthesis:none; }
.shell { width:760px; margin:0 auto; padding:28px 32px 32px; }
/* margin-left:auto instead of justify-content:space-between: the badge then cannot be pushed
   past the container's content edge, whatever the engine measures for the brand block. */
.head { display:flex; align-items:center; }
.brand { display:flex; align-items:center; gap:12px; flex:0 0 auto; }
/* The inner block must not shrink either: a 4px wider text run on WebKitGTK used to
   shrink it and change the width of every header line. */
/* Fixed width + overflow:hidden: the box geometry is identical on every OS even though WebKitGTK
   measures the same string a few pixels narrower, and the hidden overflow keeps scrollWidth
   at 760 (a visible nowrap overflow used to widen the document by 6px on GTK). */
/* The :not(.logo) matters: .logo is a sibling div, and an unscoped .brand > div rule silently
   widened the logo to 300px, which pushed the badge out of the header. */
.brand > div:not(.logo) { flex:0 0 auto; width:300px; overflow:hidden; }
.logo { flex:0 0 38px; width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#6366f1,#22d3ee);
  color:#fff; font-weight:700; font-size:17px; display:flex; align-items:center; justify-content:center; }
.title { font-size:19px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.sub { font-size:12px; color:#64748b; white-space:nowrap; }
.badge { flex:0 0 auto; margin-left:auto; max-width:180px; font-family:ZTSMono; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
  padding:5px 10px; border-radius:999px; background:#e0e7ff; color:#4338ca; border:1px solid #c7d2fe; }
.card { margin-top:22px; background:#fff; border:1px solid #e2e8f0; border-radius:16px;
  padding:22px 24px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
.counter { display:flex; align-items:center; gap:16px; }
.value { font-family:ZTSMono; font-size:44px; font-weight:400; line-height:1;
  min-width:120px; color:#0f172a; }
button { font-family:ZTSSans; font-size:14px; font-weight:600; padding:9px 16px; border-radius:10px;
  border:1px solid #cbd5e1; background:#fff; color:#0f172a; cursor:pointer; }
button.primary { background:#4f46e5; border-color:#4338ca; color:#fff; }
.features { margin:20px 0 0; padding:0; list-style:none; display:grid; grid-template-columns:1fr 1fr 1fr;
  gap:12px; }
.features li { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px;
  font-size:13px; color:#334155; }
.features b { display:block; font-size:13px; color:#0f172a; margin-bottom:2px; }
.meta { margin-top:18px; display:flex; align-items:center; justify-content:space-between;
  font-family:ZTSMono; font-size:12px; color:#64748b; }
.tag { color:#0f766e; }
/* Zig-only panel. Shared by all nine builds so the 3-OS comparator still diffs identical DOM.
   A red badge means the static demo has no Zig host behind it.
   EVERY box has an explicit width/height (plus box-sizing:border-box): the text swaps between
   ZIG OFFLINE / an em dash and ZIG ONLINE / a 16-hex seal when the Zig probe resolves, and an
   intrinsic-size flex item would otherwise reflow by ~100px mid-measurement. Fixed geometry
   makes the layout fingerprint independent of *when* the probe lands, on all three engines.
   The small buttons also need -webkit-appearance:none: WebKitGTK and WKWebView ship different
   UA padding for a bare button, which is a 5px cross-OS difference. */
.zigbar { box-sizing:border-box; display:flex; align-items:center; gap:10px; flex-wrap:nowrap;
  width:100%; height:47px; margin-top:14px; padding:12px 0 0; border-top:1px solid #e2e8f0; }
.zigbadge { box-sizing:border-box; flex:0 0 104px; width:104px; height:34px; line-height:24px;
  padding:4px 8px; text-align:center; white-space:nowrap; overflow:hidden;
  font-family:ZTSMono; font-size:11px; letter-spacing:.04em;
  border-radius:999px; background:#fee2e2; color:#b42318; border:1px solid #fecaca; }
.zigbadge[data-online="true"] { background:#dcfce7; color:#0f7b3f; border-color:#bbf7d0; }
.zigseal { box-sizing:border-box; flex:0 0 120px; width:120px; height:24px; line-height:24px;
  white-space:nowrap; overflow:hidden; font-family:ZTSMono; font-size:12px; color:#0f766e; }
.zigcount { box-sizing:border-box; flex:0 0 32px; width:32px; height:24px; line-height:24px;
  text-align:right; font-family:ZTSMono; font-size:14px; color:#0f172a; }
.zigbtn { box-sizing:border-box; flex:0 0 32px; width:32px; height:30px; margin:0; padding:0;
  line-height:28px; text-align:center; -webkit-appearance:none; appearance:none;
  font-family:ZTSMono; font-size:12px; border-radius:8px;
  border:1px solid #cbd5e1; background:#fff; color:#0f172a; cursor:pointer; }
.zigbtn:disabled { opacity:.45; cursor:not-allowed; }
.zighint { box-sizing:border-box; flex:1 1 auto; min-width:0; height:24px; line-height:24px;
  overflow:hidden; white-space:nowrap; font-family:ZTSMono; font-size:11px; color:#64748b; }
</style>
</head>
<body>
<zts-root></zts-root>
<script src="main.js" type="module"></script></body>
</html>
